name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pentarix-dms-portfolio/package-lock.json

      - run: npm ci
        working-directory: pentarix-dms-portfolio

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        working-directory: pentarix-dms-portfolio
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # SPA fallback: GitHub Pages serves 404.html for unknown paths,
      # so deep links like /about load the app and React Router takes over.
      - run: cp dist/index.html dist/404.html
        working-directory: pentarix-dms-portfolio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pentarix-dms-portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
