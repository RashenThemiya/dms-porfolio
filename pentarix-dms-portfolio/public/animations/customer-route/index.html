<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Customer distribution route preview</title>
    <link rel="stylesheet" href="/animations/customer-route/route.css" />
  </head>
  <body>
    <div
      id="map3d"
      role="img"
      aria-label="Illustrative network of twelve street routes departing from one branch, with sample shops along the roads. Drag to rotate."
    ></div>
    <div class="overlay top">
      <div class="glass route-chip">
        <b id="customer-name">Customer route preview</b>
        <span id="customer-summary">Distribution operations</span>
      </div>
      <span class="status">12 routes / 1 branch</span>
    </div>
    <div class="overlay glass hint" id="hint">Drag to rotate</div>
    <div class="overlay glass map-key">
      <span class="shop-swatch" aria-hidden="true"></span>Sample shops
      <span class="vehicle-key delivery">● Delivery</span>
      <span class="vehicle-key rep">● Sales rep</span>
    </div>
    <div class="overlay glass stats" aria-label="Customer totals across all routes">
      <div><small>Routes</small><b id="customer-routes">–</b></div>
      <div><small>Shops</small><b id="customer-shops">–</b></div>
      <div><small>Items</small><b id="customer-items">–</b></div>
    </div>
    <script src="/animations/customer-route/route-data.js"></script>
    <script src="/animations/customer-route/fallback.js"></script>
    <script src="/vendor/three.min.js"></script>
    <script src="/vendor/OrbitControls.js"></script>
    <script src="/animations/customer-route/route.js"></script>
  </body>
</html>
